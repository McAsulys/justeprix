name: Build Windows MSI (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Build MSI
      run: |
        gradle packageDistributionForCurrentOS --no-daemon
    
    - name: Upload MSI
      uses: actions/upload-artifact@v4
      with:
        name: justeprix-windows
        path: build/compose/binaries/main/*.msi
        retention-days: 7
