name: Desktop Release

on:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Install WiX Toolset
      run: |
        choco install wixtoolset --no-progress -y
      shell: pwsh
    
    - name: Build app image
      run: |
        gradle clean createDistributable --no-daemon
      shell: pwsh
    
    - name: Create MSI with jpackage
      run: |
        $appDir = "build\compose\binaries\main\app\justeprix"
        $jpackage = "$env:JAVA_HOME\bin\jpackage.exe"
        & $jpackage `
          --input "$appDir\lib" `
          --name justeprix `
          --app-version "1.0.0" `
          --main-class "MainKt" `
          --main-jar "justeprix-*.jar" `
          --win-shortcut `
          --win-menu `
          --icon "$appDir\lib\justeprix.png" `
          --type msi `
          --dest "build\compose\binaries\main\msi"
      shell: pwsh
    
    - name: Upload MSI
      uses: actions/upload-artifact@v4
      with:
        name: justeprix-windows
        path: build/compose/binaries/main/msi/*.msi
        retention-days: 7

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: justeprix-windows
        path: artifacts
    
    - name: Get version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
      env:
        GITHUB_REF: ${{ github.ref }}
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*.msi
        name: Release ${{ steps.version.outputs.version }}
        body: "Automated release for version ${{ steps.version.outputs.version }}"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
