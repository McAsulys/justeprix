name: Desktop Release

on:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Install WiX Toolset
      run: |
        choco install wixtoolset --no-progress -y
      shell: pwsh
    
    - name: Build MSI
      run: |
        gradle clean packageDistributionForCurrentOS --no-daemon -v
      shell: pwsh
      env:
        GRADLE_OPTS: "-Dorg.gradle.logging.level=info"
    
    - name: List build outputs
      run: |
        Get-ChildItem -Path build\compose\binaries\main -Recurse -File | Select-Object FullName
      shell: pwsh
    
    - name: Upload MSI
      uses: actions/upload-artifact@v4
      with:
        name: justeprix-windows
        path: |
          build/compose/binaries/main/*.msi
          build/compose/binaries/main/msi/*.msi
        retention-days: 7

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: justeprix-windows
        path: artifacts
    
    - name: Get version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
      env:
        GITHUB_REF: ${{ github.ref }}
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*.msi
        name: Release ${{ steps.version.outputs.version }}
        body: "Automated release for version ${{ steps.version.outputs.version }}"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
